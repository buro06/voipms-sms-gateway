[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voipms-sms-gateway"
version = "0.1.0"
description = "voip.ms SMS/MMS <-> Telegram forum-topic gateway"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.6,<23",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.2",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
smsgw = "smsgw.__main__:run"

[tool.setuptools]
packages = ["smsgw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
